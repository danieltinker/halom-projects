<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mana has moved</title>
<script>
/* Mana moved to its own repository (github.com/danieltinker/mana) on 13 Oct 2026 and is served at halom.io/mana/.
   This page sends an old address here to the same place there, with its query and fragment. */
(function () {
  var p = location.pathname, i = p.indexOf('/projects/menus/');
  var rest = i < 0 ? '' : p.slice(i + '/projects/menus/'.length);
  location.replace('https://halom.io/mana/' + rest + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://halom.io/mana/"></noscript>
</head>
<body style="font:16px/1.5 system-ui,sans-serif;padding:24px;background:#0b0907;color:#f4ede2">
<p>Mana has moved to <a style="color:inherit" href="https://halom.io/mana/">halom.io/mana</a>.</p>
</body>
</html>
